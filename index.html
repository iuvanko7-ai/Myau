<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<title>Мяу Страйк</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; font-family:-apple-system,sans-serif; background:#0a0612; color:#fff; position:fixed; touch-action:none; }
#gameCanvas { display:block; width:100vw; height:100vh; position:fixed; top:0; left:0; touch-action:none; }
.screen { position:fixed; inset:0; display:none; z-index:10; }
.screen.active { display:block; }
.overlay-screen { background:radial-gradient(circle at 50% 30%, #2a1a4a 0%, #0a0612 70%); display:none; align-items:center; justify-content:center; flex-direction:column; padding:20px; overflow-y:auto; }
.overlay-screen.active { display:flex; }
.menu-logo { text-align:center; margin-bottom:20px; }
.menu-logo .paw { font-size:4.5rem; display:block; margin-bottom:8px; filter:drop-shadow(0 0 30px #ff6bd6); }
.menu-logo h1 { font-size:2.6rem; font-weight:900; background:linear-gradient(135deg,#ff6bd6,#a56bff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
.menu-logo h1 span { display:block; font-size:1.6rem; color:#ffd166; -webkit-text-fill-color:#ffd166; letter-spacing:8px; margin-top:6px; }
.menu-balance { display:flex; align-items:center; gap:8px; background:rgba(255,215,0,0.12); border:2px solid rgba(255,215,0,0.4); padding:10px 24px; border-radius:16px; font-weight:900; color:#ffd166; font-size:1.2rem; margin-bottom:24px; }
.menu-buttons { display:flex; flex-direction:column; gap:10px; width:100%; max-width:340px; }
.menu-btn { display:flex; align-items:center; gap:14px; padding:14px 18px; border:none; border-radius:16px; font-family:inherit; font-size:1.05rem; font-weight:800; cursor:pointer; color:#fff; text-align:left; }
.menu-btn .icon { font-size:1.6rem; width:44px; height:44px; border-radius:12px; background:rgba(0,0,0,0.25); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.menu-btn .text { flex:1; display:flex; flex-direction:column; gap:2px; }
.menu-btn .title { font-size:1.05rem; font-weight:900; }
.menu-btn .sub { font-size:0.72rem; opacity:0.75; }
.btn-play { background:linear-gradient(135deg,#ff6b6b,#c94b4b); box-shadow:0 5px 0 #8a2020; }
.btn-drop { background:linear-gradient(135deg,#a56bff,#6a3bb5); box-shadow:0 5px 0 #4a2180; }
.btn-inv { background:linear-gradient(135deg,#4a9eff,#2a6bd5); box-shadow:0 5px 0 #1a4a9a; }
.crosshair { position:fixed; top:50%; left:50%; width:30px; height:30px; transform:translate(-50%,-50%); pointer-events:none; z-index:10; }
.crosshair::before, .crosshair::after { content:''; position:absolute; background:rgba(255,255,255,0.9); }
.crosshair::before { top:50%; left:0; right:0; height:2px; transform:translateY(-50%); }
.crosshair::after { left:50%; top:0; bottom:0; width:2px; transform:translateX(-50%); }
.crosshair-dot { position:absolute; top:50%; left:50%; width:5px; height:5px; background:#ff3b6b; border-radius:50%; transform:translate(-50%,-50%); }
.hud-top { position:fixed; top:calc(env(safe-area-inset-top,0px) + 10px); left:10px; right:10px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:20; }
.hud-stats { display:flex; gap:6px; flex-wrap:wrap; }
.stat-pill { background:rgba(15,22,40,0.85); border:2px solid rgba(120,160,255,0.35); color:#fff; font-weight:700; font-size:0.78rem; padding:6px 12px; border-radius:24px; }
.stat-pill.coins { color:#ffd166; }
.stat-pill.kills { color:#4cd964; }
.stat-pill.hp { color:#ff6b6b; }
.hud-btn { width:46px; height:46px; border-radius:14px; background:rgba(15,22,40,0.85); border:2px solid rgba(120,160,255,0.35); color:#fff; font-size:1.3rem; display:flex; align-items:center; justify-content:center; cursor:pointer; pointer-events:auto; }
.mobile-controls { position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 20px); left:0; right:0; display:flex; justify-content:space-between; align-items:flex-end; padding:0 20px; z-index:15; pointer-events:none; }
.joystick-left, .joystick-right { width:130px; height:130px; border-radius:50%; position:relative; pointer-events:auto; touch-action:none; }
.joystick-left { background:rgba(30,50,90,0.35); border:3px solid rgba(120,170,255,0.5); }
.joystick-right { background:rgba(90,30,50,0.35); border:3px solid rgba(255,100,140,0.5); }
.joystick-left .knob { background:radial-gradient(circle at 35% 30%,#a8c5ff,#4a6fd8); }
.joystick-right .knob { background:radial-gradient(circle at 35% 30%,#ffa8c0,#d84a6f); }
.joystick-left .knob, .joystick-right .knob { width:56px; height:56px; border-radius:50%; border:3px solid rgba(255,255,255,0.5); position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; }
.joystick-left .label, .joystick-right .label { position:absolute; bottom:-22px; left:50%; transform:translateX(-50%); font-size:0.68rem; font-weight:700; color:#93a4c9; }
.action-buttons { position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 170px); right:20px; display:flex; flex-direction:column; gap:12px; align-items:flex-end; z-index:15; pointer-events:none; }
.action-btn { width:76px; height:76px; border-radius:50%; border:4px solid rgba(255,255,255,0.5); color:#fff; font-size:1.6rem; display:flex; align-items:center; justify-content:center; pointer-events:auto; touch-action:none; }
.shoot-action { background:radial-gradient(circle at 35% 30%,#ff6b6b,#c94b4b); }
.jump-action { background:radial-gradient(circle at 35% 30%,#7ef0a8,#1f9c55); width:64px; height:64px; font-size:1.3rem; }
.upgrade-panel { position:fixed; right:10px; top:60px; width:280px; max-height:70vh; background:rgba(15,10,30,0.95); border:2px solid rgba(255,209,102,0.4); border-radius:16px; padding:12px; z-index:50; transform:translateX(120%); transition:transform 0.3s; overflow-y:auto; }
.upgrade-panel.open { transform:translateX(0); }
.toast { position:fixed; top:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.9); color:#fff; padding:10px 20px; border-radius:12px; font-size:0.85rem; font-weight:700; z-index:300; pointer-events:none; opacity:0; transition:opacity 0.25s; }
.toast.show { opacity:1; }
@media (hover:hover) and (pointer:fine) { .mobile-controls, .action-buttons { display:none; } }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="screen overlay-screen active" id="screenMenu">
  <div class="menu-logo"><span class="paw">🐾</span><h1>МЯУ<span>СТРАЙК</span></h1></div>
  <div class="menu-balance"><span>🪙</span><span id="menuBalance">0</span></div>
  <div class="menu-buttons">
    <button class="menu-btn btn-play" id="btnPlay"><span class="icon">🎯</span><span class="text"><span class="title">Играть</span><span class="sub">Стреляй по котам-врагам</span></span><span>›</span></button>
    <button class="menu-btn btn-drop" id="btnDrop"><span class="icon">🎁</span><span class="text"><span class="title">Мяу Дроп</span><span class="sub">Кейсы со скинами</span></span><span>›</span></button>
    <button class="menu-btn btn-inv" id="btnInv"><span class="icon">🎒</span><span class="text"><span class="title">Инвентарь</span><span class="sub">Скины и брелки</span></span><span>›</span></button>
  </div>
</div>

<div class="screen" id="screenGame">
  <div class="crosshair"><div class="crosshair-dot"></div></div>
  <div class="hud-top">
    <div class="hud-stats">
      <div class="stat-pill coins"><span>🪙</span><span id="hudCoins">0</span></div>
      <div class="stat-pill kills"><span>💀</span><span id="hudKills">0</span></div>
      <div class="stat-pill hp"><span>❤️</span><span id="hudHp">100</span></div>
    </div>
    <button class="hud-btn" id="hudMenu">🏠</button>
  </div>
  <div class="mobile-controls">
    <div class="joystick-left" id="joyLeft"><div class="knob" id="knobLeft"></div></div>
    <div class="joystick-right" id="joyRight"><div class="knob" id="knobRight"></div></div>
  </div>
  <div class="action-buttons">
    <div class="action-btn shoot-action" id="shootBtn">🎯</div>
    <div class="action-btn jump-action" id="jumpBtn">⬆</div>
  </div>
</div>

<div class="screen overlay-screen" id="screenDrop">
  <div style="text-align:center;padding:40px;">
    <h2 style="color:#a56bff;font-size:2rem;margin-bottom:16px;">🎁 Мяу Дроп</h2>
    <p style="color:#a0a0c0;margin-bottom:20px;">Скоро!</p>
    <button class="menu-btn btn-inv" id="backFromDrop" style="max-width:200px;margin:0 auto;"><span>◀</span><span class="text"><span class="title">Назад</span></span></button>
  </div>
</div>

<div class="screen overlay-screen" id="screenInv">
  <div style="text-align:center;padding:40px;">
    <h2 style="color:#4a9eff;font-size:2rem;margin-bottom:16px;">🎒 Инвентарь</h2>
    <p style="color:#a0a0c0;margin-bottom:20px;">Пусто</p>
    <button class="menu-btn btn-inv" id="backFromInv" style="max-width:200px;margin:0 auto;"><span>◀</span><span class="text"><span class="title">Назад</span></span></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function() {
"use strict";

if (typeof THREE === 'undefined') {
  alert('Не загрузился Three.js. Проверь интернет.');
  return;
}

// === НАСТРОЙКИ ===
var settings = { soundOn: true, volume: 0.7, vibrateOn: true, sensitivity: 3.0, moveSpeed: 1.0 };
try { var s = localStorage.getItem('myau_settings'); if (s) settings = Object.assign(settings, JSON.parse(s)); } catch(e) {}
function saveSettings() { try { localStorage.setItem('myau_settings', JSON.stringify(settings)); } catch(e) {} }

// === ЗВУК ===
var audioCtx = null;
function initAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, dur, type, vol) {
  if (!settings.soundOn || !audioCtx) return;
  var t = audioCtx.currentTime;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime((vol || 0.12) * settings.volume, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
}
function playShoot() {
  if (!settings.soundOn || !audioCtx) return;
  var t = audioCtx.currentTime;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(400, t);
  o.frequency.exponentialRampToValueAtTime(80, t + 0.08);
  g.gain.setValueAtTime(0.15 * settings.volume, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.1);
}
function playHit() { playTone(150, 0.1, 'sawtooth', 0.1); }
function playKill() { playTone(660, 0.15, 'sine', 0.12); setTimeout(function() { playTone(880, 0.15, 'sine', 0.12); }, 80); }
function vibrate(ms) { if (settings.vibrateOn && navigator.vibrate) navigator.vibrate(ms); }

// === 3D ===
var canvas = document.getElementById('gameCanvas');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a35);
scene.fog = new THREE.Fog(0x1a1a35, 25, 80);
var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);

scene.add(new THREE.AmbientLight(0x8090c0, 0.8));
var sun = new THREE.DirectionalLight(0xffeedd, 1.0);
sun.position.set(20, 30, 15);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xa56bff, 0x2a1a4a, 0.5));

var ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: 0x2a2a4a }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

var grid = new THREE.GridHelper(200, 100, 0x5a5a8a, 0x3a3a5a);
grid.position.y = 0.01;
scene.add(grid);

var obstacles = [];
var colorsArr = [0xd32f2f, 0x4a9eff, 0xffd166, 0x4cd964, 0xa56bff];
for (var i = 0; i < 20; i++) {
  var size = 1 + Math.random() * 1.5;
  var box = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), new THREE.MeshLambertMaterial({ color: colorsArr[i % colorsArr.length] }));
  box.position.x = (Math.random() - 0.5) * 70;
  box.position.z = (Math.random() - 0.5) * 70;
  box.position.y = size / 2;
  box.userData.size = size;
  scene.add(box);
  obstacles.push(box);
}

// === ПЕРЕМЕННЫЕ ===
var player = { pos: new THREE.Vector3(0, 0, 0), yaw: 0, pitch: 0, height: 1.6, vy: 0 };
var enemies = [];
var enemySpawnTimer = 0;
var lastTime = performance.now();
var mouseLocked = false;
var holdMouseInterval = null;
var jumpRequested = false;
var shootHoldInterval = null;
var running = false;
var toastTimer = null;

var state = {
  coins: 0, kills: 0, wave: 1, hp: 100,
  upgrades: { damage: 1, fireRate: 1, magazine: 1 },
  magazine: 6, isReloading: false, lastShot: 0,
  inventory: { weapon: [], charm: [] }
};

// Загрузка/сохранение
try {
  var saved = localStorage.getItem('myau_save');
  if (saved) {
    var d = JSON.parse(saved);
    state.coins = d.coins || 0;
    state.upgrades = d.upgrades || state.upgrades;
    state.inventory = d.inventory || state.inventory;
  }
} catch(e) {}
function saveGame() {
  try { localStorage.setItem('myau_save', JSON.stringify({ coins: state.coins, upgrades: state.upgrades, inventory: state.inventory })); } catch(e) {}
}

function getWeaponStats() {
  var u = state.upgrades;
  return {
    damage: 15 + (u.damage - 1) * 6,
    fireRate: Math.max(100, 500 - (u.fireRate - 1) * 20),
    magazine: 6 + u.magazine * 2,
    reloadTime: 1800
  };
}

function formatNum(n) {
  n = Math.floor(n);
  if (n < 1000) return n.toString();
  if (n < 1e6) return (n / 1000).toFixed(1) + 'K';
  return (n / 1e6).toFixed(2) + 'M';
}

// === ВРАГИ ===
var ENEMY_COLORS = [0xd32f2f, 0xb71c1c, 0x4a7c3f, 0x00897b, 0x455a64];
var ENEMY_NAMES = ['Гоблин', 'Орк', 'Зомби', 'Пришелец', 'Робот'];

function createEnemy(color) {
  var group = new THREE.Group();
  var body = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: color }));
  group.add(body);
  var eyeGeo = new THREE.SphereGeometry(0.12, 8, 8);
  var eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  var eL = new THREE.Mesh(eyeGeo, eyeMat); eL.position.set(-0.25, 0.15, 0.51); group.add(eL);
  var eR = new THREE.Mesh(eyeGeo, eyeMat); eR.position.set(0.25, 0.15, 0.51); group.add(eR);
  var pGeo = new THREE.SphereGeometry(0.06, 6, 6);
  var pMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  var pL = new THREE.Mesh(pGeo, pMat); pL.position.set(-0.25, 0.15, 0.6); group.add(pL);
  var pR = new THREE.Mesh(pGeo, pMat); pR.position.set(0.25, 0.15, 0.6); group.add(pR);
  return group;
}

function spawnEnemy() {
  var idx = Math.min(ENEMY_NAMES.length - 1, Math.floor(state.wave / 5));
  var baseHp = 25 + idx * 50;
  var hp = Math.floor(baseHp * (1 + (state.wave - 1) * 0.15));
  var reward = 15 + idx * 20;
  var model = createEnemy(ENEMY_COLORS[idx]);
  var size = 1.2 + idx * 0.2;
  model.scale.set(size, size, size);
  model.position.y = size * 0.5;
  var angle = Math.random() * Math.PI * 2;
  var dist = 25 + Math.random() * 15;
  model.position.x = player.pos.x + Math.cos(angle) * dist;
  model.position.z = player.pos.z + Math.sin(angle) * dist;
  scene.add(model);
  enemies.push({ model: model, hp: hp, maxHp: hp, reward: reward, speed: 0.5, name: ENEMY_NAMES[idx], lastAttack: 0 });
}

function killEnemy(enemy) {
  scene.remove(enemy.model);
  var idx = enemies.indexOf(enemy);
  if (idx >= 0) enemies.splice(idx, 1);
  state.kills++;
  state.coins += enemy.reward;
  playKill();
  vibrate(20);
  showToast('⚔️ ' + enemy.name + ' убит! +' + enemy.reward + ' 🪙');
  if (state.kills % 5 === 0) { state.wave++; showToast('🌊 Волна ' + state.wave + '!'); }
  saveGame();
  updateHUD();
}

// === УПРАВЛЕНИЕ ===
var keys = {};
var joyLeftVec = { x: 0, y: 0 };
var joyRightVec = { x: 0, y: 0 };

function isTouch() { return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0); }

window.addEventListener('keydown', function(e) {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') e.preventDefault();
});
window.addEventListener('keyup', function(e) {
  keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener('click', function() {
  initAudio();
  if (!isTouch() && !mouseLocked && document.getElementById('screenGame').classList.contains('active')) {
    canvas.requestPointerLock();
  }
});
document.addEventListener('pointerlockchange', function() {
  mouseLocked = document.pointerLockElement === canvas;
});
document.addEventListener('mousemove', function(e) {
  if (mouseLocked) {
    var sens = 0.002 * (settings.sensitivity / 3);
    player.yaw -= e.movementX * sens;
    player.pitch -= e.movementY * sens;
    player.pitch = Math.max(-1.3, Math.min(1.3, player.pitch));
  }
});
document.addEventListener('mousedown', function(e) {
  if (mouseLocked && e.button === 0) {
    shoot();
    if (!holdMouseInterval) holdMouseInterval = setInterval(function() { if (mouseLocked) shoot(); }, 120);
  }
});
document.addEventListener('mouseup', function() {
  if (holdMouseInterval) { clearInterval(holdMouseInterval); holdMouseInterval = null; }
});

function setupJoystick(el, knob, onMove, onEnd) {
  el.addEventListener('touchstart', function(e) {
    e.preventDefault(); initAudio();
    var t = e.changedTouches[0];
    var r = el.getBoundingClientRect();
    el._tid = t.identifier;
    el._cx = r.left + r.width / 2;
    el._cy = r.top + r.height / 2;
  }, { passive: false });
  el.addEventListener('touchmove', function(e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier !== el._tid) continue;
      var dx = t.clientX - el._cx;
      var dy = t.clientY - el._cy;
      var d = Math.hypot(dx, dy);
      if (d > 55) { dx = (dx / d) * 55; dy = (dy / d) * 55; }
      knob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
      onMove(dx / 55, dy / 55);
    }
  }, { passive: false });
  el.addEventListener('touchend', function(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === el._tid) {
        el._tid = null;
        knob.style.transform = 'translate(-50%, -50%)';
        onEnd();
      }
    }
  }, { passive: false });
  el.addEventListener('touchcancel', function() {
    el._tid = null;
    knob.style.transform = 'translate(-50%, -50%)';
    onEnd();
  });
}
setupJoystick(document.getElementById('joyLeft'), document.getElementById('knobLeft'),
  function(x, y) { joyLeftVec.x = x; joyLeftVec.y = y; },
  function() { joyLeftVec.x = 0; joyLeftVec.y = 0; });
setupJoystick(document.getElementById('joyRight'), document.getElementById('knobRight'),
  function(x, y) { joyRightVec.x = x; joyRightVec.y = y; },
  function() { joyRightVec.x = 0; joyRightVec.y = 0; });

document.getElementById('jumpBtn').addEventListener('touchstart', function(e) {
  e.preventDefault(); initAudio(); jumpRequested = true;
}, { passive: false });

document.getElementById('shootBtn').addEventListener('touchstart', function(e) {
  e.preventDefault(); initAudio(); shoot();
  if (!shootHoldInterval) shootHoldInterval = setInterval(shoot, 120);
}, { passive: false });
document.getElementById('shootBtn').addEventListener('touchend', function(e) {
  e.preventDefault();
  if (shootHoldInterval) { clearInterval(shootHoldInterval); shootHoldInterval = null; }
}, { passive: false });

// === ИГРОК ===
function updatePlayer(dt) {
  if (!running) return;
  var mx = 0, mz = 0;
  if (keys['w'] || keys['arrowup']) mz -= 1;
  if (keys['s'] || keys['arrowdown']) mz += 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  if (isTouch()) { mx += joyLeftVec.x; mz += joyLeftVec.y; }
  var len = Math.hypot(mx, mz);
  if (len > 1) { mx /= len; mz /= len; }
  if (isTouch()) {
    player.yaw -= joyRightVec.x * 2.0 * dt;
    player.pitch -= joyRightVec.y * 1.4 * dt;
    player.pitch = Math.max(-1.3, Math.min(1.3, player.pitch));
  }
  if (jumpRequested && player.pos.y <= 0.01) { player.vy = 5; jumpRequested = false; vibrate(15); }
  player.vy -= 15 * dt;
  player.pos.y += player.vy * dt;
  if (player.pos.y <= 0) { player.pos.y = 0; player.vy = 0; }

  var cosY = Math.cos(player.yaw);
  var sinY = Math.sin(player.yaw);
  var speed = 5 * settings.moveSpeed;
  var wX = (mx * cosY - mz * sinY) * speed * dt;
  var wZ = (mx * sinY + mz * cosY) * speed * dt;

  var newX = player.pos.x + wX;
  var newZ = player.pos.z + wZ;
  for (var i = 0; i < obstacles.length; i++) {
    var box = obstacles[i];
    var dx = newX - box.position.x;
    var dz = newZ - box.position.z;
    var half = box.userData.size / 2 + 0.4;
    if (Math.abs(dx) < half && Math.abs(dz) < half) {
      if (Math.abs(dx) > Math.abs(dz)) newX = box.position.x + Math.sign(dx) * half;
      else newZ = box.position.z + Math.sign(dz) * half;
    }
  }
  var lim = 95;
  player.pos.x = Math.max(-lim, Math.min(lim, newX));
  player.pos.z = Math.max(-lim, Math.min(lim, newZ));

  camera.position.set(player.pos.x, player.pos.y + player.height, player.pos.z);
  var look = new THREE.Vector3(
    -Math.sin(player.yaw) * Math.cos(player.pitch),
    Math.sin(player.pitch),
    -Math.cos(player.yaw) * Math.cos(player.pitch)
  );
  camera.lookAt(camera.position.x + look.x, camera.position.y + look.y, camera.position.z + look.z);
}

function updateEnemies(dt) {
  if (!running) return;
  for (var i = 0; i < enemies.length; i++) {
    var e = enemies[i];
    var dx = player.pos.x - e.model.position.x;
    var dz = player.pos.z - e.model.position.z;
    var d = Math.hypot(dx, dz);
    if (d < 0.1) continue;
    if (d > 2) {
      e.model.position.x += (dx / d) * e.speed * dt;
      e.model.position.z += (dz / d) * e.speed * dt;
      e.model.rotation.y = Math.atan2(dx, dz);
    } else {
      var now = performance.now();
      if (now - e.lastAttack > 2000) {
        e.lastAttack = now;
        var dmg = Math.floor(3 + state.wave);
        state.hp -= dmg;
        vibrate(30);
        showToast('💔 -' + dmg + ' HP');
        updateHUD();
        if (state.hp <= 0) { state.hp = 0; playerDeath(); }
      }
    }
  }
}

function shoot() {
  if (!running || state.isReloading) return;
  var stats = getWeaponStats();
  var now = performance.now();
  if (now - state.lastShot < stats.fireRate) return;
  if (state.magazine <= 0) { startReload(); return; }
  state.lastShot = now;
  state.magazine--;
  playShoot();
  vibrate(12);

  var rayDir = new THREE.Vector3(
    -Math.sin(player.yaw) * Math.cos(player.pitch),
    Math.sin(player.pitch),
    -Math.cos(player.yaw) * Math.cos(player.pitch)
  );
  var rayOrigin = camera.position.clone();
  var bestEnemy = null;
  var bestDot = 0.94;
  for (var i = 0; i < enemies.length; i++) {
    var e = enemies[i];
    var toEnemy = new THREE.Vector3().subVectors(e.model.position, rayOrigin);
    var dist = toEnemy.length();
    if (dist > 100) continue;
    toEnemy.normalize();
    var dot = rayDir.dot(toEnemy);
    if (dot > bestDot) { bestDot = dot; bestEnemy = e; }
  }
  if (bestEnemy) {
    bestEnemy.hp -= stats.damage;
    playHit();
    if (bestEnemy.hp <= 0) killEnemy(bestEnemy);
  }
}

function startReload() {
  if (state.isReloading) return;
  var stats = getWeaponStats();
  state.isReloading = true;
  showToast('🔄 Перезарядка…');
  setTimeout(function() {
    state.isReloading = false;
    state.magazine = stats.magazine;
    vibrate(10);
  }, stats.reloadTime);
}

// === ЦИКЛ ===function loop(ts) {
  var dt = Math.min(0.05, (ts - lastTime) / 1000);
  lastTime = ts;
  if (running) {
    updatePlayer(dt);
    updateEnemies(dt);
    enemySpawnTimer += dt;
    if (enemySpawnTimer > 3 && enemies.length < 3 + Math.floor(state.wave / 2)) {
      enemySpawnTimer = 0;
      spawnEnemy();
    }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// === HUD ===
function updateHUD() {
  document.getElementById('hudCoins').textContent = state.coins;
  document.getElementById('hudKills').textContent = state.kills;
  document.getElementById('hudHp').textContent = Math.max(0, Math.floor(state.hp));
  document.getElementById('menuBalance').textContent = state.coins;
}

function showToast(text) {
  var el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, 1500);
}

function playerDeath() {
  running = false;
  alert('💀 Ты погиб! Волна: ' + state.wave + ', убито: ' + state.kills);
  pauseAndMenu();
}

// === ЭКРАНЫ ===
function switchScreen(name) {
  var screens = {
    menu: document.getElementById('screenMenu'),
    game: document.getElementById('screenGame'),
    drop: document.getElementById('screenDrop'),
    inv: document.getElementById('screenInv')
  };
  for (var k in screens) screens[k].classList.remove('active');
  if (screens[name]) screens[name].classList.add('active');
}

function startGame() {
  state.kills = 0;
  state.wave = 1;
  state.hp = 100;
  state.magazine = getWeaponStats().magazine;
  state.isReloading = false;
  state.lastShot = 0;
  running = true;
  player.pos.set(0, 0, 0);
  player.yaw = 0;
  player.pitch = 0;
  player.vy = 0;
  for (var i = 0; i < enemies.length; i++) scene.remove(enemies[i].model);
  enemies.length = 0;
  enemySpawnTimer = 0;
  updateHUD();
  switchScreen('game');
  for (var j = 0; j < 2; j++) setTimeout(spawnEnemy, j * 600);
}

function pauseAndMenu() {
  running = false;
  if (document.pointerLockElement) document.exitPointerLock();
  for (var i = 0; i < enemies.length; i++) scene.remove(enemies[i].model);
  enemies.length = 0;
  switchScreen('menu');
  updateHUD();
}

// === КНОПКИ (все в одном месте, в конце) ===
document.getElementById('btnPlay').addEventListener('click', function() {
  initAudio();
  startGame();
});
document.getElementById('btnDrop').addEventListener('click', function() {
  initAudio();
  switchScreen('drop');
});
document.getElementById('btnInv').addEventListener('click', function() {
  initAudio();
  switchScreen('inv');
});
document.getElementById('backFromDrop').addEventListener('click', function() { switchScreen('menu'); });
document.getElementById('backFromInv').addEventListener('click', function() { switchScreen('menu'); });
document.getElementById('hudMenu').addEventListener('click', pauseAndMenu);

// === РЕСАЙЗ ===
function onResize() {
  var w = window.innerWidth;
  var h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

// === СТАРТ ===
updateHUD();
onResize();
lastTime = performance.now();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
